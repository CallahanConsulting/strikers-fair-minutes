<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strikers Fair Minutes</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fair Minutes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Strikers Fair Minutes">
  <meta property="og:description" content="Even playing time for every Lee County Strikers player. Add it to your home screen.">
  <meta property="og:image" content="https://callahanconsulting.github.io/strikers-fair-minutes/icon-512.png">
  <script>
    // Opened from the home-screen icon: go straight to the app
    if (window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches) {
      window.location.replace("./");
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 22px;
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
      text-align: center;
    }
    img { width: 140px; height: 140px; border-radius: 28px; }
    .club { color: #74c47f; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; margin-top: 4px; }
    .box {
      background: #111; border: 1px solid #2c2c2c; border-radius: 16px;
      padding: 14px 18px; color: #bbb; font-size: 14px; line-height: 1.9;
      text-align: left; width: 100%; max-width: 330px;
    }
    .box h2 { font-size: 12px; color: #fff; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }
    .box b { color: #74c47f; font-weight: 600; }
    a.open {
      display: inline-block; background: #2b6e34; color: #fff; text-decoration: none;
      font-weight: 700; padding: 12px 26px; border-radius: 999px; font-size: 15px;
    }
    a.open:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <img src="apple-touch-icon.png" alt="Lee County Strikers crest">
  <div>
    <p class="club">Lee County Strikers</p>
    <h1>Fair Minutes</h1>
  </div>
  <div class="box">
    <h2>iPhone (Safari)</h2>
    1. Tap <b>Share ↑</b> at the bottom<br>
    2. Tap <b>Add to Home Screen</b><br>
    3. Tap <b>Add</b>
  </div>
  <div class="box">
    <h2>Android (Chrome)</h2>
    1. Tap the <b>⋮</b> menu at the top right<br>
    2. Tap <b>Add to Home screen</b> or <b>Install app</b><br>
    3. Tap <b>Add</b>
  </div>
  <a class="open" href="./">Open Fair Minutes</a>
</body>
</html>
